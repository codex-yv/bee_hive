services:
  app:
    build: .
    container_name: beehive
    ports:
      - 8000:8000
    environment:
      MONGO_URI: "mongodb://admin:qwerty@mongo:27017/?authSource=admin"
      DOC_USERNAME: ${DOC_USERNAME}
      DOC_PASSWORD: ${DOC_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      CLOUD_NAME: ${CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
    
    depends_on:
      - mongo
    
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    volumes:
      - mongo-data:/data/db
    
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - 8081:8081
    
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: "mongodb://admin:qwerty@mongo:27017/?authSource=admin"
    
    depends_on:
      - mongo

volumes:
  mongo-data: